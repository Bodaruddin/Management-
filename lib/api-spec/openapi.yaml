openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: authentication
    description: Sign-in and active-session operations
  - name: teachers
    description: Teacher account operations
  - name: health
    description: Health operations
  - name: teacher-attendance
    description: GPS and biometric-backed teacher attendance
  - name: teacher-leaves
    description: Teacher leave applications
  - name: teacher-holidays
    description: Teacher holidays
  - name: student-attendance
    description: Student attendance holiday rules
paths:
  /teachers/login:
    post:
      operationId: loginTeacher
      tags: [teachers]
      summary: Verify teacher credentials and start a server session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherLoginRequest"
      responses:
        "200":
          description: Teacher profile and new session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherLoginResponse"
        "401":
          description: Invalid teacher credentials
        "503":
          description: Database unavailable
  /settings/admin-credentials/verify:
    post:
      operationId: verifyAdminCredentials
      tags: [authentication]
      summary: Verify administrator credentials and start a server session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Credential verification result and session token when valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
  /auth/session:
    get:
      operationId: validateAuthSession
      tags: [authentication]
      security:
        - BearerSessionAuth: []
      responses:
        "200":
          description: The session is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStatus"
        "401":
          description: The session has expired or was revoked
  /auth/logout:
    post:
      operationId: logoutAuthSession
      tags: [authentication]
      security:
        - BearerSessionAuth: []
      responses:
        "204":
          description: Session revoked
  /teachers/{id}/force-logout:
    post:
      operationId: forceLogoutTeacher
      tags: [teachers]
      summary: Revoke all active sessions for a teacher
      security:
        - BearerSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Teacher sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherForceLogoutResult"
        "401":
          description: An active administrator session is required
        "403":
          description: The caller is not an administrator
        "404":
          description: Teacher not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /student-attendance/settings:
    get:
      operationId: getStudentAttendanceHolidaySettings
      tags: [student-attendance]
      responses:
        "200":
          description: Student attendance holiday settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAttendanceHolidaySettings"
    put:
      operationId: updateStudentAttendanceHolidaySettings
      tags: [student-attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentAttendanceHolidaySettingsUpdate"
      responses:
        "200":
          description: Updated student attendance holiday settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAttendanceHolidaySettings"
  /student-attendance/holidays:
    post:
      operationId: createStudentAttendanceHoliday
      tags: [student-attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentAttendanceHolidayCreate"
      responses:
        "201":
          description: Holiday created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherHoliday"
  /student-attendance/holidays/{id}:
    put:
      operationId: updateStudentAttendanceHoliday
      tags: [student-attendance]
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentAttendanceHolidayCreate"
      responses:
        "200":
          description: Holiday updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherHoliday"
        "404":
          description: Holiday not found
    delete:
      operationId: deleteStudentAttendanceHoliday
      tags: [student-attendance]
      parameters:
        - $ref: "#/components/parameters/RecordId"
        - $ref: "#/components/parameters/AdminId"
      responses:
        "204":
          description: Holiday deleted
        "404":
          description: Holiday not found
  /settings/teacher-attendance:
    get:
      operationId: getTeacherAttendanceSettings
      tags: [teacher-attendance]
      responses:
        "200":
          description: Attendance settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAttendanceSettings"
    put:
      operationId: updateTeacherAttendanceSettings
      tags: [teacher-attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherAttendanceSettingsUpdate"
      responses:
        "200":
          description: Updated attendance settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAttendanceSettings"
  /teacher-attendance:
    get:
      operationId: listTeacherAttendance
      tags: [teacher-attendance]
      parameters:
        - $ref: "#/components/parameters/TeacherId"
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: Teacher attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherAttendanceRecord"
  /teacher-attendance/reset:
    post:
      operationId: resetTeacherAttendance
      tags: [teacher-attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherAttendanceReset"
      responses:
        "200":
          description: Teacher attendance records reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAttendanceResetResult"
  /teacher-attendance/face-status:
    get:
      operationId: getTeacherFaceStatus
      tags: [teacher-attendance]
      parameters:
        - $ref: "#/components/parameters/TeacherId"
      responses:
        "200":
          description: Whether the teacher has completed face enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherFaceStatus"
  /teacher-attendance/face-enroll:
    post:
      operationId: enrollTeacherFace
      tags: [teacher-attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherFaceEnroll"
      responses:
        "201":
          description: Face enrollment completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherFaceStatus"
  /teacher-attendance/check-in:
    post:
      operationId: teacherCheckIn
      tags: [teacher-attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherCheckIn"
      responses:
        "201":
          description: Attendance created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAttendanceRecord"
  /teacher-attendance/{id}/check-out:
    post:
      operationId: teacherCheckOut
      tags: [teacher-attendance]
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherCheckOut"
      responses:
        "200":
          description: Attendance updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAttendanceRecord"
  /teacher-leaves:
    get:
      operationId: listTeacherLeaves
      tags: [teacher-leaves]
      parameters:
        - $ref: "#/components/parameters/TeacherId"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Teacher leave applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherLeave"
    post:
      operationId: applyForTeacherLeave
      tags: [teacher-leaves]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherLeaveCreate"
      responses:
        "201":
          description: Leave application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherLeave"
  /teacher-leaves/{id}:
    put:
      operationId: updateTeacherLeave
      tags: [teacher-leaves]
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherLeaveUpdate"
      responses:
        "200":
          description: Updated pending leave application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherLeave"
    delete:
      operationId: deleteTeacherLeave
      tags: [teacher-leaves]
      parameters:
        - $ref: "#/components/parameters/RecordId"
        - name: teacherId
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Pending leave application deleted
  /teacher-leaves/{id}/approve:
    put:
      operationId: approveTeacherLeave
      tags: [teacher-leaves]
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAction"
      responses:
        "200":
          description: Approved leave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherLeave"
  /teacher-leaves/{id}/reject:
    put:
      operationId: rejectTeacherLeave
      tags: [teacher-leaves]
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAction"
      responses:
        "200":
          description: Rejected leave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherLeave"
  /teacher-holidays:
    get:
      operationId: listTeacherHolidays
      tags: [teacher-holidays]
      responses:
        "200":
          description: Teacher holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherHoliday"
    post:
      operationId: createTeacherHoliday
      tags: [teacher-holidays]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherHolidayCreate"
      responses:
        "201":
          description: Holiday created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherHoliday"
  /teacher-holidays/{id}:
    put:
      operationId: updateTeacherHoliday
      tags: [teacher-holidays]
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherHolidayCreate"
      responses:
        "200":
          description: Holiday updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherHoliday"
    delete:
      operationId: deleteTeacherHoliday
      tags: [teacher-holidays]
      parameters:
        - $ref: "#/components/parameters/RecordId"
        - $ref: "#/components/parameters/AdminId"
      responses:
        "204":
          description: Holiday deleted
  /teacher-attendance/payroll/calculate:
    post:
      operationId: calculateTeacherPayroll
      tags: [teacher-attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollCalculate"
      responses:
        "200":
          description: Month-end payroll report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollReport"
  /settings/admin-users:
    get:
      operationId: listAdminUsers
      tags: [admin-users]
      responses:
        "200":
          description: Administrator accounts without passwords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
    post:
      operationId: createAdminUser
      tags: [admin-users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreate"
      responses:
        "201":
          description: Administrator account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /settings/admin-users/{id}:
    put:
      operationId: updateAdminUser
      tags: [admin-users]
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Administrator account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /settings/admin-users/{id}/switch-teacher:
    post:
      operationId: switchAdminToTeacher
      tags: [admin-users]
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminId]
              properties:
                adminId: { type: string }
      responses:
        "200":
          description: Linked teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
components:
  securitySchemes:
    BearerSessionAuth:
      type: http
      scheme: bearer
  parameters:
    TeacherId:
      name: teacherId
      in: query
      required: false
      schema: { type: string }
    Month:
      name: month
      in: query
      required: false
      schema: { type: string }
    Status:
      name: status
      in: query
      required: false
      schema: { type: string }
    RecordId:
      name: id
      in: path
      required: true
      schema: { type: string }
    AdminId:
      name: adminId
      in: query
      required: true
      schema: { type: string }
  schemas:
    TeacherLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    TeacherLoginResponse:
      type: object
      required: [id, name, username, sessionToken]
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        sessionToken: { type: string }
        permissions: { type: object, additionalProperties: true }
      additionalProperties: true
    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    AdminLoginResponse:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        admin:
          oneOf:
            - $ref: "#/components/schemas/AdminUser"
            - type: "null"
        sessionToken: { type: string }
        expiresAt: { type: integer }
    AuthSessionStatus:
      type: object
      required: [valid, userId, role, expiresAt]
      properties:
        valid: { type: boolean, const: true }
        userId: { type: string }
        role: { type: string, enum: [admin, teacher] }
        expiresAt: { type: string, format: date-time }
    TeacherForceLogoutResult:
      type: object
      required: [success, revokedSessions]
      properties:
        success: { type: boolean }
        revokedSessions: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        linkedTeacherId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, name, username]
    AdminUserCreate:
      type: object
      required: [adminId, name, username, password]
      properties:
        adminId: { type: string }
        name: { type: string }
        username: { type: string }
        password: { type: string }
        linkedTeacherId: { type: [string, "null"] }
    AdminUserUpdate:
      type: object
      required: [adminId]
      properties:
        adminId: { type: string }
        name: { type: string }
        password: { type: string }
        linkedTeacherId: { type: [string, "null"] }
    TeacherProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        permissions: { type: object, additionalProperties: true }
      required: [id, name, username]
    TeacherAttendanceSettings:
      type: object
      properties:
        schoolLatitude: { type: [number, "null"] }
        schoolLongitude: { type: [number, "null"] }
        radiusMeters: { type: number }
        checkInStart: { type: string }
        checkInEnd: { type: string }
        checkOutStart: { type: string }
        checkOutEnd: { type: string }
        requireFaceVerification: { type: boolean }
        allowLateCheckIn: { type: boolean }
        sundayHoliday: { type: boolean }
        workingDaysPerMonth: { type: integer }
        lateGraceMinutes: { type: integer }
        lateDeductionAmount: { type: number }
        deductionType: { type: string, enum: [daily_rate, fixed] }
    StudentAttendanceHolidaySettings:
      type: object
      required: [sundayHoliday, holidays]
      properties:
        sundayHoliday: { type: boolean }
        holidays:
          type: array
          items:
            $ref: "#/components/schemas/TeacherHoliday"
    StudentAttendanceHolidaySettingsUpdate:
      type: object
      required: [adminId, sundayHoliday]
      properties:
        adminId: { type: string }
        sundayHoliday: { type: boolean }
    StudentAttendanceHolidayCreate:
      type: object
      required: [adminId, date, name]
      properties:
        adminId: { type: string }
        date: { type: string, format: date }
        name: { type: string }
    TeacherAttendanceSettingsUpdate:
      allOf:
        - $ref: "#/components/schemas/TeacherAttendanceSettings"
      required: [adminId]
      properties:
        adminId: { type: string }
    TeacherAttendanceRecord:
      type: object
      properties:
        id: { type: string }
        teacherId: { type: string }
        teacherName: { type: string }
        date: { type: string }
        status: { type: string, enum: [present, late, absent, leave, holiday] }
        checkInAt: { type: [string, "null"], format: date-time }
        checkOutAt: { type: [string, "null"], format: date-time }
        checkInLatitude: { type: [number, "null"] }
        checkInLongitude: { type: [number, "null"] }
        checkOutLatitude: { type: [number, "null"] }
        checkOutLongitude: { type: [number, "null"] }
        distanceFromSchool: { type: [number, "null"] }
        faceVerified: { type: string }
        faceVerificationMethod: { type: [string, "null"] }
    TeacherAttendanceReset:
      type: object
      required: [adminId]
      properties:
        adminId: { type: string }
        teacherId: { type: string, description: "Omit to reset attendance for every teacher" }
    TeacherAttendanceResetResult:
      type: object
      required: [deletedCount]
      properties:
        deletedCount: { type: integer }
        teacherId: { type: [string, "null"] }
    TeacherFaceStatus:
      type: object
      properties:
        enrolled: { type: boolean }
        method: { type: string }
      required: [enrolled]
    TeacherFaceEnroll:
      type: object
      required: [teacherId, faceImageBase64]
      properties:
        teacherId: { type: string }
        faceImageBase64: { type: string, description: "Camera selfie used to create the private teacher face template" }
        faceSamplesBase64:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string }
          description: "Short burst of independent camera samples used to create a more reliable private template"
        replaceExisting:
          type: boolean
          description: "Replace the teacher's existing template after an explicit re-enrollment"
    TeacherCheckIn:
      type: object
      required: [teacherId, teacherName, latitude, longitude, faceVerified]
      properties:
        teacherId: { type: string }
        teacherName: { type: string }
        date: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        faceVerified: { type: boolean }
        faceVerificationMethod: { type: string }
        faceImageBase64: { type: string, description: "Camera selfie used to enroll or match the teacher face template" }
        faceSamplesBase64:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string }
          description: "Short burst of camera samples; the server verifies the strongest usable frame"
    TeacherCheckOut:
      type: object
      required: [teacherId, latitude, longitude]
      properties:
        teacherId: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        faceImageBase64: { type: string, description: "Camera selfie used to match the enrolled teacher face template" }
        faceSamplesBase64:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string }
          description: "Short burst of camera samples; the server verifies the strongest usable frame"
    TeacherLeave:
      type: object
      properties:
        id: { type: string }
        teacherId: { type: string }
        teacherName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        adminNote: { type: [string, "null"] }
    TeacherLeaveCreate:
      type: object
      required: [teacherId, teacherName, startDate, endDate, reason]
      properties:
        teacherId: { type: string }
        teacherName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string }
    TeacherLeaveUpdate:
      type: object
      required: [teacherId, startDate, endDate, reason]
      properties:
        teacherId: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string }
    AdminAction:
      type: object
      required: [adminId]
      properties:
        adminId: { type: string }
        adminNote: { type: string }
    TeacherHoliday:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date }
        name: { type: string }
    TeacherHolidayCreate:
      type: object
      required: [adminId, date, name]
      properties:
        adminId: { type: string }
        date: { type: string, format: date }
        name: { type: string }
    PayrollCalculate:
      type: object
      required: [adminId, month, year]
      properties:
        adminId: { type: string }
        month: { type: string }
        year: { type: integer }
    PayrollReport:
      type: object
      properties:
        month: { type: string }
        year: { type: integer }
        workingDays: { type: integer }
        scheduledWorkingDays: { type: integer }
        daysInMonth: { type: integer }
        result:
          type: array
          items:
            type: object

